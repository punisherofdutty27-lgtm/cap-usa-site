name: Deploy to OVH via SFTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy site to OVH
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload site to OVH via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.OVH_SFTP_USER }}
          server: ${{ secrets.OVH_SFTP_HOST }}
          port: ${{ secrets.OVH_SFTP_PORT }}
          password: ${{ secrets.OVH_SFTP_PASSWORD }}
          local_path: './site/*'
          remote_path: ${{ secrets.OVH_REMOTE_PATH }}
          sftp_only: true
          delete_remote_files: false
